name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch makes the previous run irrelevant. Cancel it
# rather than queueing six students behind each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Expo SDK 57 requires Node >= 22.13.x.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      # Advisory only: expo-doctor flags upstream version drift we often cannot
      # fix in the same PR. It should inform us, not block a teammate's merge.
      - name: Expo doctor (non-blocking)
        run: npx expo-doctor
        continue-on-error: true
